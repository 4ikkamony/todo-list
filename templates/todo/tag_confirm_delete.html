{% extends "base.html" %}

{% block header %}
  <div class="row">
    <div class="container bg-dark text-white text-center mb-2 p-2">
      <div class="d-flex justify-content-between">
        <h1>Confirm deletion of a Tag</h1>
      </div>
    </div>
  </div>
{% endblock %}

{% block content %}
  <p>Delete tag {{ tag.name }}?</p>
  <form action="" method="post">
    {% csrf_token %}
    <input type="submit" value="Delete" class="btn btn-danger">
    <a href="{% url 'todo:tag-list' %}" class="btn btn-primary">Cancel</a>
  </form>
{% endblock %}
